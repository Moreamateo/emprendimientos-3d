<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emprendimientos 3D</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0a0a0c;
  --card: #141416;
  --card2: #1a1a1e;
  --tx: #f4f4f5;
  --mu: #a1a1aa;
  --bd: #27272a;
  --ac: #e11d48;
  --ac-dim: rgba(225, 29, 72, 0.15);
  --yellow: #eab308;
  --yellow-dim: rgba(234, 179, 8, 0.12);
  --ok: #22c55e;
  --ok-dim: rgba(34, 197, 94, 0.15);
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--tx);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* Sidebar */
aside {
  width: 220px;
  padding: 20px 12px;
  border-right: 1px solid var(--bd);
  background: #0e0e11;
  position: sticky;
  top: 0;
  height: 100vh;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}
aside h1 {
  font-size: 17px;
  font-weight: 700;
  margin: 0 8px 18px;
  letter-spacing: -0.02em;
}
aside h1 span { color: var(--ac); }

nav { display: flex; flex-direction: column; gap: 2px; }
nav button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  color: var(--mu);
  padding: 10px 12px;
  border-radius: 10px;
  font: inherit;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.18s ease;
}
nav button:hover { background: var(--card2); color: var(--tx); }
nav button.on {
  background: var(--ac-dim);
  color: var(--ac);
  font-weight: 600;
}
nav button .ico { font-size: 16px; width: 20px; text-align: center; }

main {
  flex: 1;
  min-width: 0;
  padding: 28px 32px 40px;
  max-width: 1100px;
  animation: fadeIn 0.35s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

h2 {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.03em;
  margin-bottom: 4px;
}
p.s { color: var(--mu); margin-bottom: 22px; font-size: 14px; }

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 16px;
  transition: border-color 0.2s ease;
}
.card:hover { border-color: #3f3f46; }
.card .title {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--tx);
  margin-bottom: 12px;
}

.g {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 14px;
}

label {
  display: block;
  font-size: 12px;
  color: var(--mu);
  font-weight: 500;
}
input, select {
  width: 100%;
  margin-top: 5px;
  padding: 10px 12px;
  border: 1px solid var(--bd);
  border-radius: 10px;
  background: var(--card2);
  color: var(--tx);
  font: inherit;
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}
input:focus, select:focus {
  outline: none;
  border-color: var(--ac);
  box-shadow: 0 0 0 3px var(--ac-dim);
}

/* Buttons */
button.p {
  background: var(--ac);
  color: #fff;
  border: 0;
  border-radius: 10px;
  padding: 11px 18px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease;
  box-shadow: 0 2px 8px rgba(225, 29, 72, 0.25);
}
button.p:hover { background: #be123c; transform: translateY(-1px); }
button.p:active { transform: translateY(0); }

button.s2 {
  background: transparent;
  border: 1px solid var(--bd);
  color: var(--tx);
  border-radius: 10px;
  padding: 10px 16px;
  font: inherit;
  font-weight: 500;
  cursor: pointer;
  width: 100%;
  margin-top: 8px;
  transition: all 0.18s ease;
}
button.s2:hover { border-color: #52525b; background: var(--card2); }

button.x {
  background: none;
  border: 0;
  color: var(--mu);
  cursor: pointer;
  font-size: 15px;
  padding: 4px 6px;
  border-radius: 6px;
  transition: color 0.15s, background 0.15s;
}
button.x:hover { color: var(--ac); background: var(--ac-dim); }

/* Layout */
.two {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 20px;
  align-items: start;
}
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } }

/* Multipliers */
.mu { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.mb {
  padding: 9px 16px;
  border: 1px solid var(--bd);
  background: var(--card2);
  color: var(--tx);
  border-radius: 10px;
  cursor: pointer;
  font: inherit;
  font-weight: 600;
  transition: all 0.18s ease;
}
.mb:hover { border-color: #52525b; }
.mb.on {
  background: var(--ac);
  border-color: var(--ac);
  color: #fff;
  box-shadow: 0 2px 10px rgba(225, 29, 72, 0.3);
}

/* Results */
.rw {
  display: flex;
  justify-content: space-between;
  padding: 7px 0;
  color: var(--mu);
  font-size: 13.5px;
  animation: slideIn 0.3s ease both;
}
.rw b { color: var(--tx); font-weight: 600; }
hr { border: 0; border-top: 1px solid var(--bd); margin: 10px 0; }

@keyframes slideIn {
  from { opacity: 0; transform: translateX(-6px); }
  to { opacity: 1; transform: translateX(0); }
}

.bx {
  border-radius: 12px;
  padding: 14px 16px;
  margin-top: 12px;
  border: 1px solid;
  animation: popIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.bx small {
  display: block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.bx div {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

@keyframes popIn {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}

.bx.total { background: var(--ac-dim); border-color: rgba(225, 29, 72, 0.45); }
.bx.total small { color: var(--ac); }
.bx.total div { color: #fda4af; }

.bx.ml { background: var(--yellow-dim); border-color: rgba(234, 179, 8, 0.4); }
.bx.ml small { color: var(--yellow); }
.bx.ml div { color: #fde047; }

.rf { list-style: none; padding: 0; margin: 10px 0 0; color: var(--mu); font-size: 12.5px; }
.rf li { padding: 3px 0; }
.hint { font-size: 11px; font-style: italic; color: var(--mu); margin-top: 2px; display: block; }

/* Tables */
.w { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td {
  text-align: left;
  padding: 10px 8px;
  border-bottom: 1px solid var(--bd);
  white-space: nowrap;
}
th {
  font-size: 11px;
  color: var(--mu);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
tr:hover td { background: rgba(255,255,255,0.02); }

.k { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
.k small { display: block; font-size: 12px; color: var(--mu); font-weight: 500; margin-top: 2px; }

a { color: var(--ac); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Profile bar */
.profile-bar {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.profile-bar select { flex: 1; min-width: 140px; }
.profile-bar button.p { white-space: nowrap; margin-top: 0; }

/* ========== STOCK ========== */
.stock-tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--bd);
  margin-bottom: 16px;
}
.stock-tabs button {
  background: none;
  border: 0;
  color: var(--mu);
  padding: 10px 18px;
  font: inherit;
  font-weight: 500;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.18s;
}
.stock-tabs button.on {
  color: var(--ac);
  border-bottom-color: var(--ac);
  font-weight: 600;
}

.filament-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: var(--card2);
  border: 1px solid var(--bd);
  border-radius: 12px;
  margin-bottom: 10px;
  transition: border-color 0.2s;
  animation: slideIn 0.3s ease both;
}
.filament-item:hover { border-color: #3f3f46; }

/* CSS Filament spool */
.spool {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  position: relative;
  flex-shrink: 0;
  box-shadow: inset 0 0 0 6px var(--spool-color, #666), 0 2px 8px rgba(0,0,0,0.4);
  background: radial-gradient(circle at 50% 50%, #1a1a1e 0%, #1a1a1e 28%, var(--spool-color, #666) 30%, var(--spool-color, #666) 100%);
}
.spool::before {
  content: '';
  position: absolute;
  inset: 14px;
  border-radius: 50%;
  background: #0e0e11;
  box-shadow: inset 0 0 0 2px #333;
}
.spool::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 8px;
  height: 8px;
  margin: -4px 0 0 -4px;
  border-radius: 50%;
  background: #333;
}

.filament-info { flex: 1; min-width: 0; }
.filament-info .name {
  font-weight: 600;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.filament-info .meta { font-size: 12px; color: var(--mu); margin-top: 2px; }
.badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 6px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.badge.pla { background: rgba(59,130,246,0.2); color: #60a5fa; }
.badge.petg { background: rgba(168,85,247,0.2); color: #c084fc; }
.badge.tpu { background: rgba(34,197,94,0.2); color: #4ade80; }
.badge.abs { background: rgba(249,115,22,0.2); color: #fb923c; }
.badge.low { background: rgba(234,179,8,0.2); color: #fbbf24; }

.progress-wrap { margin-top: 8px; }
.progress-bar {
  height: 6px;
  background: #27272a;
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 3px;
  background: var(--ac);
  transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}
.progress-fill.low { background: var(--yellow); }
.progress-fill.crit { background: #ef4444; }
.progress-text {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--mu);
  margin-top: 4px;
}

/* ========== QUOTES / PRESUPUESTOS ========== */
.quote-item, .sale-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--card2);
  border: 1px solid var(--bd);
  border-radius: 12px;
  margin-bottom: 8px;
  transition: border-color 0.2s;
  animation: slideIn 0.3s ease both;
}
.quote-item:hover, .sale-item:hover { border-color: #3f3f46; }
.quote-item .left, .sale-item .left { display: flex; flex-direction: column; gap: 2px; }
.quote-item .name { font-weight: 600; }
.quote-item .meta { font-size: 12px; color: var(--mu); }
.badge.sold { background: var(--ok-dim); color: var(--ok); }
.badge.pending { background: rgba(234,179,8,0.15); color: #fbbf24; }

/* ========== STATS BARS ========== */
.chart-card { padding: 20px; }
.chart-bars {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  height: 180px;
  padding-top: 10px;
  margin-bottom: 8px;
}
.chart-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
  justify-content: flex-end;
  gap: 4px;
}
.chart-bar-group {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  width: 100%;
  height: 100%;
  justify-content: center;
}
.chart-bar {
  width: 14px;
  border-radius: 4px 4px 0 0;
  transition: height 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  min-height: 2px;
}
.chart-bar.ing { background: #22c55e; }
.chart-bar.gas { background: #ef4444; }
.chart-label {
  font-size: 11px;
  color: var(--mu);
  text-align: center;
  margin-top: 6px;
  white-space: nowrap;
}
.legend {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin-bottom: 16px;
  font-size: 12px;
  color: var(--mu);
}
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  display: inline-block;
}
.legend .ing { background: #22c55e; }
.legend .gas { background: #ef4444; }

.stat-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--bd);
  font-size: 13.5px;
}
.stat-row:last-child { border-bottom: 0; }
.stat-row .ingreso { color: #4ade80; }
.stat-row .gasto { color: #f87171; }

/* Botón peligro */
button.danger {
  background: #ef4444;
  color: #fff;
  border: 0;
  border-radius: 10px;
  padding: 10px 16px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(239, 68, 68, 0.35);
  transition: transform 0.15s, background 0.15s;
}
button.danger:hover { background: #dc2626; transform: translateY(-1px); }

/* Mobile / tablet */
@media (max-width: 900px) {
  .two { grid-template-columns: 1fr; }
  .g { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 760px) {
  body { flex-direction: column; }
  #app-wrap { flex-direction: column !important; }
  aside {
    width: 100%;
    height: auto;
    position: static;
    border-right: 0;
    border-bottom: 1px solid var(--bd);
    padding: 12px 10px;
  }
  aside h1 { margin: 0 4px 10px; font-size: 16px; }
  nav {
    flex-direction: row;
    overflow-x: auto;
    gap: 4px;
    padding-bottom: 6px;
    -webkit-overflow-scrolling: touch;
  }
  nav button {
    width: auto;
    white-space: nowrap;
    padding: 8px 12px;
    font-size: 13px;
  }
  .user-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-top: 8px;
  }
  main { padding: 14px 12px 28px; }
  h2 { font-size: 20px; }
  .card { padding: 14px; }
  .g { grid-template-columns: 1fr; gap: 12px; }
  .bx div { font-size: 22px; }
  .chart-bars { height: 130px; gap: 6px; }
  .chart-bar { width: 10px; }
  .profile-bar { flex-direction: column; align-items: stretch; }
  .quote-item, .sale-item, .filament-item {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }
  .quote-item > div:last-child,
  .filament-item > button {
    align-self: stretch;
  }
  .auth-box { padding: 24px 18px; }
  .k { font-size: 22px; }
}
@media (max-width: 420px) {
  nav button .ico { display: none; }
  main { padding: 12px 10px 24px; }
  .bx div { font-size: 20px; }
}

.bx.pulse { animation: pulse 0.4s ease; }
@keyframes pulse {
  0% { transform: scale(1); }
  40% { transform: scale(1.02); }
  100% { transform: scale(1); }
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #22c55e;
  color: #fff;
  padding: 12px 20px;
  border-radius: 10px;
  font-weight: 600;
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 100;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Auth screen */
#auth-screen {
  position: fixed; inset: 0; z-index: 200;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
#auth-screen.hidden { display: none; }
.auth-box {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 32px 28px;
  width: 100%; max-width: 380px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.auth-box h1 {
  font-size: 22px; font-weight: 700; margin-bottom: 4px;
  text-align: center;
}
.auth-box h1 span { color: var(--ac); }
.auth-box .sub {
  text-align: center; color: var(--mu); font-size: 13px; margin-bottom: 24px;
}
.auth-box label { margin-bottom: 12px; }
.auth-box input { margin-top: 4px; }
.auth-box button.p { width: 100%; margin-top: 8px; }
.auth-box .switch {
  text-align: center; margin-top: 16px; font-size: 13px; color: var(--mu);
}
.auth-box .switch a { color: var(--ac); cursor: pointer; font-weight: 600; }
.auth-error {
  background: rgba(239,68,68,0.15); color: #fca5a5;
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: 8px; padding: 10px 12px; margin-bottom: 12px;
  font-size: 13px; display: none;
}
.auth-error.show { display: block; }
#app-wrap.hidden { display: none !important; }
.user-bar {
  margin-top: auto; padding: 12px 8px 4px;
  border-top: 1px solid var(--bd); font-size: 12px; color: var(--mu);
}
.user-bar button {
  background: none; border: 0; color: var(--ac); cursor: pointer;
  font: inherit; font-weight: 600; padding: 4px 0;
}
/* Calculator only: reference palette and spacing. */
.calc-ui { --tx:#f1f5fb; --mu:#9db0c9; --bd:#34475e; --ac:#60a5fa; color:var(--tx); }
.calc-ui [hidden] { display:none !important; }
.calc-ui .calc-layout { display:grid; grid-template-columns:minmax(0,2fr) minmax(290px,1fr); gap:24px; align-items:start; }
.calc-ui .card { background:#1d2a3a; border:1px solid #34475e; border-radius:14px; padding:24px; margin-bottom:22px; }
.calc-ui .title { font-size:20px; font-weight:750; margin-bottom:18px; }
.calc-ui .section-icon { margin-right:10px; color:#00e5b0; }
.calc-ui .g { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px 16px; }
.calc-ui label { color:#91c5ff; font-size:14px; font-weight:650; }
.calc-ui input,.calc-ui select { background:#0f1727; color:#f1f5fb; border:1px solid #425873; border-radius:8px; min-height:46px; font-size:16px; width:100%; margin-top:6px; }
.calc-ui input:focus,.calc-ui select:focus { outline:2px solid #60a5fa; outline-offset:1px; }
.calc-ui .field-unit { position:relative; display:block; }
.calc-ui .field-unit input { padding-right:80px; }
.calc-ui .unit { position:absolute; right:13px; top:20px; color:#819aba; font-size:14px; pointer-events:none; }
.calc-ui .calc-note { margin-top:20px; padding:14px 16px; border:1px solid #35567d; border-radius:12px; background:#24374e; color:#a1c4eb; line-height:1.5; }
.calc-ui .model-guide { background:#182435; border:1px solid var(--bd); border-radius:12px; padding:16px; margin-bottom:18px; }
.calc-ui .model-guide label { color:#fff; }
.calc-ui .help { display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px; margin-left:5px; border:1px solid #4e83bd; border-radius:50%; color:#60a5fa; font-size:12px; cursor:help; }
.calc-ui .rw { display:flex; justify-content:space-between; gap:12px; padding:10px 0; color:var(--mu); }
.calc-ui .rw b { color:#f1f5fb; white-space:nowrap; }
.calc-ui .rw.labor b { color:#c084fc; }
.calc-ui hr { border:0; border-top:1px solid var(--bd); margin:16px 0; }
.calc-ui .sale-box { text-align:center; border:1px solid #3b82f6; border-radius:10px; padding:16px; margin:12px 0 16px; background:#20365c; color:#60a5fa; }
.calc-ui .sale-box strong { display:block; color:#eff6ff; font-size:34px; line-height:1.4; }
.calc-ui .summary-mini { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.calc-ui .summary-mini div { padding:10px; border:1px solid var(--bd); border-radius:10px; background:#182435; }
.calc-ui .summary-mini small { display:block; color:var(--mu); }
.calc-ui .calc-summary { position:sticky; top:20px; }
.calc-ui details summary { cursor:pointer; color:#91c5ff; margin-bottom:12px; }
.calc-ui .p { background:#2563eb; color:#fff; }
@media(max-width:1050px) { .calc-ui .calc-layout { grid-template-columns:1fr; } .calc-ui .calc-summary { position:static; } }
@media(max-width:480px) { .calc-ui .card { padding:18px 14px; } .calc-ui .g { grid-template-columns:1fr; } }

/* Scoped product catalog */

function spoolColor(name) {
  const n = (name || '').toLowerCase().trim();
  for (const [k, v] of Object.entries(COLOR_MAP)) {
    if (n.includes(k)) return v;
  }
  // fallback hash
  let h = 0;
  for (let i = 0; i < n.length; i++) h = n.charCodeAt(i) + ((h << 5) - h);
  return `hsl(${Math.abs(h) % 360}, 55%, 45%)`;
}

/* Product photos: private Storage objects; only their short paths live in JSON. */
const PRODUCT_BUCKET = 'product-photos';
let productBusy = false;
function productPhotoPath(path, userId) {
  return typeof path === 'string' && path.startsWith(userId + '/') &&
    /^[a-zA-Z0-9/-]+\.jpg$/.test(path) && !path.includes('..');
}
async function compressProductPhoto(file) {
  if (!['image/jpeg','image/png','image/webp'].includes(file.type))
    throw new Error('Elegí una imagen JPG, PNG o WebP.');
  if (file.size > 10 * 1024 * 1024) throw new Error('La imagen debe pesar menos de 10 MB.');
  const bitmap = await createImageBitmap(file);
  try {
    if (bitmap.width * bitmap.height > 40000000) throw new Error('La imagen es demasiado grande (máximo 40 megapíxeles).');
    const scale = Math.min(1, 1000 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(bitmap.width * scale));
    canvas.height = Math.max(1, Math.round(bitmap.height * scale));
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#1a1a1e'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    for (const quality of [.82, .65, .45]) {
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
      if (blob && blob.size <= 512 * 1024) return blob;
    }
    throw new Error('No se pudo reducir la foto a 512 KB. Probá con otra imagen.');
  } finally { bitmap.close(); }
}

// Compare-and-swap uses a short timestamp, never the JSON document in the URL.
// No schema changes, no IDs assigned to existing records, no bulk replacement of products.
async function persistProductChange(rows, before, next, userId, state) {
  await flushSave();
  if (currentUser?.id !== userId || D !== state) throw new Error('La sesión cambió. Volvé a abrir Productos.');
  const { data: record, error } = await sb.from('user_data').select('id,data,updated_at').eq('user_id', userId).maybeSingle();
  if (error) throw error;
  if (!record) throw new Error('Primero esperá a que se sincronicen los datos de tu cuenta y reintentá.');
  if (JSON.stringify(record.data.products || []) !== before || JSON.stringify(rows) !== before)
    throw new Error('El catálogo cambió. Recargá la página para traer la última versión antes de reintentar.');
  const merged = { ...record.data, products: next };
  let update = sb.from('user_data').update({ data: merged, updated_at: new Date().toISOString() })
    .eq('user_id', userId).eq('id', record.id);
  update = record.updated_at == null
    ? update.is('updated_at', null)
    : update.eq('updated_at', record.updated_at);
  const result = await update.select('id');
  if (result.error) throw result.error;
  if (result.data?.length !== 1) throw new Error('No se confirmó el guardado: los datos cambiaron o faltan permisos. Recargá y reintentá.');
  if (currentUser?.id === userId && D === state) rows.splice(0, rows.length, ...next);
}

async function productChange({ row, file, removePhoto = false, newProduct, changes, deleteProduct = false }) {
  if (productBusy || commerceBusy || !cloudLoaded) return;
  const userId = currentUser?.id, state = D, rows = get('products');
  if (!userId) return;
  productBusy = true;
  document.querySelectorAll('nav button, #btn-logout').forEach(el => el.disabled = true);
  const root = $('#products-ui');
  root?.querySelectorAll('button,input').forEach(el => el.disabled = true);
  const status = root?.querySelector('[role="status"]');
  if (status) status.textContent = 'Guardando…';
  let uploaded;
  try {
    const before = JSON.stringify(rows);
    const index = row ? rows.indexOf(row) : -1;
    if (row && index < 0) throw new Error('El producto ya no está en el catálogo.');
    if (file) {
      const blob = await compressProductPhoto(file);
      if (currentUser?.id !== userId || D !== state) throw new Error('La sesión cambió. Reintentá.');
      uploaded = userId + '/' + crypto.randomUUID() + '.jpg';
      const { error } = await sb.storage.from(PRODUCT_BUCKET).upload(uploaded, blob, { contentType: 'image/jpeg', upsert: false });
      if (error) { uploaded = null; throw new Error('No se pudo subir la foto. Verificá tu conexión y que el bucket privado product-photos tenga permisos para tu cuenta.'); }
    }
    const next = rows.slice();
    if (newProduct) next.push({ ...newProduct, id: crypto.randomUUID(), ...(uploaded ? { photoPath: uploaded } : {}) });
    else if (deleteProduct) next.splice(index, 1);
    else {
      next[index] = { ...row, ...changes, id: row.id || crypto.randomUUID() };
      if (removePhoto) delete next[index].photoPath;
      else if (uploaded) next[index].photoPath = uploaded;
    }
    await persistProductChange(rows, before, next, userId, state);
    // Keep previous objects: deleting them here could break another session's references.
    // Detached photos can be cleaned up separately after confirming no product references them.
    uploaded = null;
    if (currentUser?.id === userId && D === state) {
      if (cur === 'products') products();
      toast('Guardado en la nube');
    }
  } catch (error) {
    // Do not delete an upload on an ambiguous network failure: the DB may have committed it.
    if (status?.isConnected) status.textContent = error.message || 'No se pudo guardar. Reintentá.';
  } finally {
    productBusy = false;
    document.querySelectorAll('nav button, #btn-logout').forEach(el => el.disabled = false);
    if (currentUser?.id === userId && D === state)
      $('#products-ui')?.querySelectorAll('button,input').forEach(el => el.disabled = false);
  }
}

async function loadProductPhotos(root, rows, userId) {
  await Promise.all(rows.map(async (row, i) => {
    if (!productPhotoPath(row.photoPath, userId)) return;
    const holder = root.querySelector('[data-photo="' + i + '"]');
    try {
      const { data, error } = await sb.storage.from(PRODUCT_BUCKET).createSignedUrl(row.photoPath, 3600);
      if (error) throw error;
      if (!holder?.isConnected || currentUser?.id !== userId) return;
      const img = document.createElement('img');
      img.alt = row.name || 'Producto'; img.loading = 'lazy';
      img.onerror = () => { holder.textContent = 'Foto no disponible'; };
      img.src = data.signedUrl;
      holder.replaceChildren(img);
    } catch (_) { if (holder?.isConnected) holder.textContent = 'Foto no disponible'; }
  }));

/* ========== CALCULADORA ========== */
// Pure calculation: weight/time/extras describe the whole batch; quantity divides it.
function calculate3D(v) {
  const n = k => Math.max(0, Number(v[k]) || 0);
  const hours = n('h') + n('min') / 60;
  const mat = n('g') / 1000 * n('pk');
  const luz = n('w') / 1000 * hours * n('kwh');
  const des = n('wear') * hours;
  const labor = n('laborRate') * n('laborHours');
  const ins = n('ins');
  const all = mat + luz + des + labor + ins;
  const qty = Math.max(1, Math.floor(n('qty')));
  return { mat, luz, des, labor, ins, cost:all, all, price:all*n('mult'), unit:all/qty, qty };
}

      </div>

    const list = tab === 'fil' ? fil : other;

    if (!list.length) {
      listEl.innerHTML = '<p style="color:var(--mu);padding:20px 0;text-align:center">Todavía no hay nada en esta categoría.</p>';

        const low = pct < 30;
        const crit = pct < 15;
        const typeClass = (r.type || 'PLA').toLowerCase();
        return `
          <div class="filament-item" style="animation-delay:${idx*0.05}s">
            <div class="spool" style="--spool-color:${spoolColor(r.color)}"></div>
            <div class="filament-info">
              <div class="name">
                ${esc(r.name || 'Sin nombre')}
                <span class="badge ${typeClass}">${esc(r.type || 'PLA')}</span>
                ${low ? '<span class="badge low">QUEDA POCO</span>' : ''}
              </div>
              <div class="meta">${esc(r.color || 'Sin color')}</div>
              <div class="progress-wrap">
                <div class="progress-bar">
                  <div class="progress-fill ${crit?'crit':low?'low':''}" style="width:${pct}%"></div>
                </div>
                <div class="progress-text">
                  <span>Peso disponible</span>
                  <span>${Math.round(r.grams)} g / ${Math.round(r.total||1000)} g</span>
                </div>
              </div>
            </div>
            <button class="x" data-i="${realIdx}">✕</button>
          </div>
        `;
      }).join('');
    }

    $$('.stock-tabs button').forEach(b => b.onclick = () => {
      tab = b.dataset.tab;
      renderStock();
    });

    $('#s_add').onclick = () => {
      const item = {
        name: $('#s_name').value || 'Filamento',
        type: $('#s_type').value,
        color: $('#s_color').value || 'Negro',
        grams: +$('#s_grams').value || 0,
        total: +$('#s_total').value || 1000,
        price: +$('#s_price').value || 0,
        other: tab === 'other'
      };
      rows.push(item);
      save();
      toast('Agregado al stock');
      renderStock();
    };

    $$('#stockList .x').forEach(b => b.onclick = () => {
      rows.splice(+b.dataset.i, 1);
      save();
      renderStock();
    });
  };

  renderStock();
}

// Los presupuestos anteriores equivalen a una unidad; no se modifica su total.
function quoteDetails(q) {
  const qty = Number.isSafeInteger(q.qty) && q.qty > 0 ? q.qty : 1;
  const unitPrice = Number.isFinite(q.unitPrice) ? q.unitPrice : (Number(q.total) || 0) / qty;
  return { qty, unitPrice };
}

  .pay p { font-size: 12px; color: #71717a; margin-top: 4px; }
  .footer { font-size: 11px; color: #a1a1aa; text-align: center; margin-top: 32px; }
  .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin:24px 0; }
  .actions button {

  <div class="sheet">

        <div class="brand">

          <p>

      ${C.cuentaNombre ? `<p>Cuenta a nombre de: <strong>${esc(C.cuentaNombre)}</strong></p>` : ''}
      ${C.aliasPago ? '<p>Transferí el monto exacto a este alias. Una vez acreditado te confirmamos el pedido.</p>' : ''}
    </div>` : `
    <div class="pay">
      <h3>Datos de pago</h3>
      <p style="color:#e11d48">Configurá tu alias de pago en Gastos fijos para que aparezca aquí.</p>

  const w = window.open('', '_blank');
  if (!w) {
    toast('Permití ventanas emergentes para ver la factura');
    return;
  }
  w.document.write(html);
  w.document.close();

function quotes() {
  const rows = get('quotes');
  const products = get('products');
  const C = D.cfg;

  const filter = { all: rows, pending: rows.filter(r => r.status !== 'Vendido'), sold: rows.filter(r => r.status === 'Vendido') };
  let tab = 'all';
  let draftItems = [];

  const renderQuotes = () => {
    const list = filter[tab] || rows;

    $('#m').innerHTML = `
      <h2>Presupuestos</h2>
      <p class="s">Creá presupuestos y generá la factura/PDF con logo y alias de pago.</p>

      <div class="card" style="margin-bottom:16px">
        <div class="title">Datos del taller (para la factura)</div>
        <div class="g">
          <label>Nombre del taller<input id="t_name" value="${esc(C.tallerName||'')}" placeholder="Nombre de tu emprendimiento"></label>
          <label>Alias de pago / CVU<input id="t_alias" value="${esc(C.aliasPago||'')}" placeholder="tu.alias.mp"></label>
          <label>Cuenta a nombre de<input id="t_account_name" value="${esc(C.cuentaNombre||'')}" placeholder="Nombre y apellido del titular"></label>
          <label>CUIT / DNI<input id="t_cuit" value="${esc(C.cuit||'')}" placeholder="20-12345678-9"></label>
          <label>Dirección<input id="t_dir" value="${esc(C.direccion||'')}" placeholder="Calle 123, Ciudad"></label>
          <label>Teléfono<input id="t_tel" value="${esc(C.telefono||'')}" placeholder="+54 9 ..."></label>
          <label>Email<input id="t_email" value="${esc(C.email||'')}" placeholder="hola@taller.com"></label>
        </div>
        <div style="margin-top:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
          <div>
            <label style="margin-bottom:6px">Logo del emprendimiento</label>
            <input type="file" id="t_logo" accept="image/*" style="font-size:13px">
            <span class="hint">Se usa en la factura. Ideal cuadrado, PNG o JPG.</span>
          </div>
          ${C.logoB64
            ? `<img id="t_logo_preview" src="${C.logoB64}" alt="Logo" style="width:64px;height:64px;object-fit:contain;border-radius:10px;border:1px solid var(--bd);background:#fff">`
            : `<div id="t_logo_preview" style="width:64px;height:64px;border-radius:10px;border:1px dashed var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:11px;text-align:center">Sin logo</div>`
          }
          ${C.logoB64 ? '<button class="danger" id="t_logo_clear" style="margin:0">✕ Quitar logo</button>' : ''}
        </div>
        <button class="s2" id="t_save" style="margin-top:14px;width:auto">Guardar datos del taller</button>
      </div>

      <div class="card">
        <div class="stock-tabs">
          <button class="${tab==='all'?'on':''}" data-tab="all">Todos ${rows.length}</button>
          <button class="${tab==='pending'?'on':''}" data-tab="pending">Pendientes ${filter.pending.length}</button>
          <button class="${tab==='sold'?'on':''}" data-tab="sold">Vendidos ${filter.sold.length}</button>
        </div>

        <div id="qList"></div>

        <div style="margin-top:20px;border-top:1px solid var(--bd);padding-top:16px">
          <div class="title">Nuevo presupuesto</div>
          <div class="g">
            <label>Cliente<input id="q_client" placeholder="Nombre del cliente"></label>
            <label>Producto del catálogo
              <select id="q_prod">
                <option value="">— Elegir producto (opcional) —</option>
                ${products.map((p,i) => `<option value="${i}">${esc(p.name)} — ${money(p.price)}</option>`).join('')}
              </select>
            </label>
            <label>Detalle / Descripción<input id="q_desc" placeholder="Se completa si elegís producto"></label>
            <label>Cantidad<input id="q_qty" type="number" min="1" step="1" value="1" required></label>
            <label>Precio por unidad (ARS)<input id="q_unit" type="number" min="0" step="0.01" value="0" required></label>
            <label>Total final (ARS)<input id="q_total" type="number" step="0.01" value="0.00" readonly aria-live="polite"></label>
            <label>Fecha<input id="q_date" type="date"></label>
            <label>Número de comprobante (opcional)<input id="q_receipt" type="text" placeholder="Ej.: 0001-00001234 · vacío: automático"></label>
          </div>
          <button type="button" class="s2" id="q_item_add">Agregar ítem al presupuesto</button><div id="q_items"></div><p id="q_grand" aria-live="polite"></p>
          <button class="p" id="q_add" style="margin-top:14px">Crear presupuesto</button>
        </div>
      </div>
    `;

    const d = $('#q_date');
    if (d) d.valueAsDate = new Date();

    $('#t_logo').onchange = e => {
      const file = e.target.files?.[0];
      if (!file) return;
      if (file.size > 800000) {
        toast('Imagen muy pesada (máx ~800 KB)');
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        // Resize if needed via canvas
        const img = new Image();
        img.onload = () => {
          const max = 240;
          let w = img.width, h = img.height;
          if (w > max || h > max) {
            const r = Math.min(max / w, max / h);
            w = Math.round(w * r); h = Math.round(h * r);
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          C.logoB64 = canvas.toDataURL('image/png');
          $('#t_logo_preview').src = C.logoB64;
          save();
          toast('Logo cargado');
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    };

    const clearBtn = $('#t_logo_clear');
    if (clearBtn) clearBtn.onclick = () => {
      delete C.logoB64;
      save();
      toast('Logo quitado');
      renderQuotes();
    };

    $('#t_save').onclick = () => {
      C.tallerName = $('#t_name').value.trim();
      C.aliasPago = $('#t_alias').value.trim();
      C.cuentaNombre = $('#t_account_name').value.trim();
      C.cuit = $('#t_cuit').value.trim();
      C.direccion = $('#t_dir').value.trim();
      C.telefono = $('#t_tel').value.trim();
      C.email = $('#t_email').value.trim();
      save();
      toast('Datos del taller guardados');
    };

    const updateQuoteTotal = () => {
      const qty = Number($('#q_qty').value), unitPrice = Number($('#q_unit').value);
      const total = qty * unitPrice;
      const valid = $('#q_qty').checkValidity() && $('#q_unit').checkValidity() &&
        Number.isSafeInteger(qty) && qty > 0 && Number.isFinite(total) && total >= 0;
      $('#q_total').value = valid ? (Math.round(total * 100) / 100).toFixed(2) : '';
      return valid;
    };
    $('#q_qty').oninput = updateQuoteTotal;
    $('#q_unit').oninput = updateQuoteTotal;

    $('#q_prod').onchange = e => {
      const i = e.target.value;
      if (i === '') return;
      const p = products[+i];
      if (p) {
        $('#q_desc').value = p.name;
        $('#q_unit').value = (Number(p.price) || 0).toFixed(2);
        updateQuoteTotal();
      }
    };

    const readDraftItem = () => {
      if (!updateQuoteTotal() || !$('#q_qty').reportValidity() || !$('#q_unit').reportValidity()) return null;
      const p = products[Number($('#q_prod').value)];
      return snapshotItem($('#q_prod').value === '' ? null : p, Number($('#q_qty').value), Number($('#q_unit').value), $('#q_desc').value.trim() || 'Pieza');
    };
    const renderDraft = () => {
      $('#q_items').innerHTML = draftItems.map((item,i)=>`<div class="card"><b>${esc(item.name)}</b><div class="g"><label>Cantidad<input type="number" min="1" step="1" required data-item-qty="${i}" value="${item.qty}"></label><label>Precio unitario<input type="number" min="0" step="0.01" required data-item-price="${i}" value="${item.unitPrice}"></label></div><p data-item-subtotal="${i}">Subtotal: ${money2(item.subtotal)}</p><button type="button" class="s2" data-item-remove="${i}">Quitar ítem</button></div>`).join('');
      const totals = () => {$('#q_grand').textContent='Total del presupuesto: '+money2(roundMoney(draftItems.reduce((a,i)=>a+i.subtotal,0)));};
      totals();
      $('#q_items').querySelectorAll('input').forEach(input=>input.oninput=()=>{
        const i=Number(input.dataset.itemQty ?? input.dataset.itemPrice), item=draftItems[i];
        if (!input.checkValidity()) return;
        item[input.dataset.itemQty !== undefined ? 'qty' : 'unitPrice']=Number(input.value);
        item.subtotal=roundMoney(item.qty*item.unitPrice);
        $('[data-item-subtotal="'+i+'"]').textContent='Subtotal: '+money2(item.subtotal);totals();
      });
      $$('[data-item-remove]').forEach(b=>b.onclick=()=>{draftItems.splice(Number(b.dataset.itemRemove),1);renderDraft();});
    };
    $('#q_item_add').onclick=()=>{const item=readDraftItem();if(!item)return;draftItems.push(item);renderDraft();$('#q_prod').value='';$('#q_desc').value='';$('#q_unit').value='0';$('#q_qty').value='1';updateQuoteTotal();};
    renderDraft();
    const listEl = $('#qList');
    if (!list.length) {
      listEl.innerHTML = '<p style="color:var(--mu);padding:20px 0;text-align:center">No hay presupuestos en esta categoría.</p>';
    } else {
      listEl.innerHTML = list.map((r, idx) => {
        const realIdx = rows.indexOf(r);
        const isSold = r.status === 'Vendido';
        const detail = quoteDetails(r);
        return `
          <div class="quote-item" style="animation-delay:${idx*0.04}s">
            <div class="left">
              <div class="name">
                ${esc(r.client || 'Sin cliente')}
                ${isSold ? '<span class="badge sold">VENDIDO</span>' : '<span class="badge pending">PENDIENTE</span>'}
                ${r.receiptNumber || r.num ? `<span style="font-size:11px;color:var(--mu)">#${esc(r.receiptNumber || String(r.num).padStart(4,'0'))}</span>` : ''}
              </div>
              <div class="meta">${esc(r.date || '')} · ${esc(r.desc || '')}</div>
              <div class="meta">${recordItems(r).map(item => esc(item.name)+' × '+item.qty+' · '+money2(item.unitPrice)).join('<br>')}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <b style="font-size:16px">Total: ${money2(r.total)}</b>
              <button class="s2" style="width:auto;margin:0;padding:6px 12px;font-size:12px" data-receipt="${realIdx}">N° comprobante</button>
              <button class="s2" style="width:auto;margin:0;padding:6px 12px;font-size:12px" data-pdf="${realIdx}">📄 Factura</button>
              ${!isSold ? `<button class="s2" style="width:auto;margin:0;padding:6px 12px;font-size:12px" data-sell="${realIdx}">Marcar vendido</button>` : ''}
              <button class="x" data-i="${realIdx}">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    $$('.stock-tabs button').forEach(b => b.onclick = () => {
      tab = b.dataset.tab;
      renderQuotes();
    });

    $('#q_add').onclick = async () => {
      if ([...$('#q_items').querySelectorAll('input')].some(input=>!input.reportValidity())) return;
      const items=draftItems.length ? structuredClone(draftItems) : [readDraftItem()].filter(Boolean);
      if(!items.length || items.some(i=>!validItem(i))) {toast('Revisá las cantidades y precios.');return;}
      if(draftItems.length && ($('#q_prod').value!=='' || $('#q_desc').value.trim() || Number($('#q_unit').value)!==0)) {toast('Agregá el ítem pendiente antes de guardar.');return;}
      const q={id:crypto.randomUUID(),num:D.quoteCounter || 1, receiptNumber:$('#q_receipt').value.trim(),date:$('#q_date').value || localDate(),client:$('#q_client').value.trim(),desc:items.map(i=>i.name).join(', '),items,qty:items.reduce((a,i)=>a+i.qty,0),total:roundMoney(items.reduce((a,i)=>a+i.subtotal,0)),status:'Pendiente'};
      await commerceChange(next=>{next.quotes.push(q);next.quoteCounter=q.num+1;},'Presupuesto guardado',quotes);
    };

    $$('[data-receipt]').forEach(b => b.onclick = () => {
      const q = rows[+b.dataset.receipt];
      const value = prompt('Número de comprobante para el PDF (vacío: automático):', q.receiptNumber || '');
      if (value === null) return;
      q.receiptNumber = value.trim();
      save();
      renderQuotes();
    });

    $$('[data-pdf]').forEach(b => b.onclick = () => {
      const q = rows[+b.dataset.pdf];
      if (!q.num) {
        q.num = D.quoteCounter || 1;
        D.quoteCounter = q.num + 1;
        save();
      }
      generateInvoice(q);
    });

    $$('[data-sell]').forEach(b => b.onclick = async () => {
      const index=Number(b.dataset.sell), q=rows[index];
      if(q.status==='Vendido' || get('sales').some(s=>q.id && s.quoteId===q.id)) return;
      await commerceChange(next=>{
        const quote=next.quotes[index]; quote.id ||= crypto.randomUUID();
        if(quote.status==='Vendido' || next.sales.some(s=>s.quoteId===quote.id)) return;
        const items=recordItems(quote), known=items.every(i=>i.unitCost!==null);
        next.sales.push({id:crypto.randomUUID(),quoteId:quote.id,date:localDate(),client:quote.client || '',name:quote.desc || items.map(i=>i.name).join(', '),items,qty:items.reduce((a,i)=>a+i.qty,0),total:Number(quote.total)||0,cost:known ? roundMoney(items.reduce((a,i)=>a+i.qty*i.unitCost,0)) : null});
        quote.status='Vendido';
      },'Venta guardada',quotes);
    });

    $$('#qList .x').forEach(b => b.onclick = () => {
      rows.splice(+b.dataset.i, 1);
      save();
      renderQuotes();
    });
  };

  renderQuotes();
}

/* ========== STATS ========== */
function stats() {
  const s = get('sales');
  const rev = s.reduce((a, r) => a + (r.total || 0), 0);
  const unknownCosts = s.some(r=>knownNumber(r.cost)===null);
  const cost = s.reduce((a, r) => a + (Number(r.cost) || 0), 0);
  const profit = rev - cost;

  // group by month
  const mo = {};
  s.forEach(r => {
    const m = (r.date || '').slice(0, 7) || 's/f';
    if (!mo[m]) mo[m] = { ing: 0, gas: 0 };
    mo[m].ing += r.total || 0;
    mo[m].gas += r.cost || 0;
  });

  // last 6 months
  const months = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = d.toISOString().slice(0, 7);
    const label = d.toLocaleDateString('es-AR', { month: 'short', year: '2-digit' });
    months.push({
      key,
      label,
      ing: mo[key]?.ing || 0,
      gas: mo[key]?.gas || 0
    });
  }

  const maxVal = Math.max(1, ...months.flatMap(m => [m.ing, m.gas]));

  const stk = get('stock').reduce((a, r) => a + ((r.grams || 0) / 1000) * (r.price || 0), 0);

  $('#m').innerHTML = `
    <h2>Estadísticas</h2>
    <p class="s">Mirá cómo viene tu taller con gráficos claros y la ganancia del mes a primera vista.</p>

    <div class="card">
      <div class="g">
        <div class="k" style="color:#4ade80">${money(rev)}<small>Ingresos totales</small></div>
        <div class="k" style="color:#f87171">${money(cost)}<small>Costos / Gastos</small></div>
        <div class="k">${money(profit)}<small>${unknownCosts ? 'Ganancia provisional: faltan costos' : 'Ganancia neta'}</small></div>
        <div class="k">${s.length}<small>Ventas registradas</small></div>
      </div>
    </div>

    <div class="card chart-card">
      <div class="title">Últimos 6 meses</div>
      <div class="legend">
        <span><i class="ing"></i> Ingresos</span>
        <span><i class="gas"></i> Gastos</span>
      </div>
      <div class="chart-bars" id="chartBars">
        ${months.map((m, i) => `
          <div class="chart-col">
            <div class="chart-bar-group">
              <div class="chart-bar ing" style="height:0%" data-h="${(m.ing / maxVal * 100).toFixed(1)}"></div>
              <div class="chart-bar gas" style="height:0%" data-h="${(m.gas / maxVal * 100).toFixed(1)}"></div>
            </div>
            <div class="chart-label">${m.label}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="card">
      <div class="title">Detalle por mes</div>
      ${months.map(m => `
        <div class="stat-row">
          <span>${m.label}</span>
          <span>
            <span class="ingreso">+ ${money(m.ing)}</span>
            &nbsp;&nbsp;
            <span class="gasto">− ${money(m.gas)}</span>
          </span>
        </div>
      `).join('') || '<p style="color:var(--mu)">Sin datos todavía.</p>'}
    </div>

    <div class="card">
      <div class="title">Valor estimado en stock</div>
      <div class="k">${money(stk)}<small>Basado en gramos restantes × precio del rollo</small></div>
    </div>
  `;

  // Animate bars
  requestAnimationFrame(() => {
    setTimeout(() => {
      $$('.chart-bar').forEach(b => {
        b.style.height = b.dataset.h + '%';
      });
    }, 50);
  });
}

// All new commerce writes confirm persistence before replacing the local state.
let commerceBusy = false;
const roundMoney = n => Math.round((n + Number.EPSILON) * 100) / 100;
const localDate = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const knownNumber = n => n !== null && n !== undefined && n !== '' && Number.isFinite(Number(n)) && Number(n)>=0 ? Number(n) : null;
function snapshotItem(product, qty, unitPrice, name) {
  return {productId:product?.id || null, productIndex:product ? get('products').indexOf(product) : -1, name:name || product?.name || 'Producto sin nombre',qty,unitPrice,unitCost:knownNumber(product?.cost),photoPath:product?.photoPath || null,subtotal:roundMoney(qty*unitPrice),snapshot:true};
}
function validItem(i) {return Number.isSafeInteger(i.qty) && i.qty>0 && Number.isFinite(i.unitPrice) && i.unitPrice>=0 && Number.isSafeInteger(Math.round(i.subtotal*100));}
function recordItems(record) {
  if(Array.isArray(record.items) && record.items.length) return record.items.map(i=>{
    const qty=Number.isSafeInteger(Number(i.qty)) && Number(i.qty)>0 ? Number(i.qty) : 1;
    const unitPrice=knownNumber(i.unitPrice) ?? 0;
    return {...i,name:i.name || i.desc || 'Producto sin nombre',qty,unitPrice,unitCost:knownNumber(i.unitCost),subtotal:knownNumber(i.subtotal) ?? roundMoney(qty*unitPrice)};
  });
  const detail=quoteDetails(record);
  return [{productId:record.productId || null,name:record.name || record.desc || 'Producto sin nombre',...detail,priceUnknown:knownNumber(record.unitPrice)===null && knownNumber(record.total)===null,unitCost:knownNumber(record.cost)===null ? null : Number(record.cost)/detail.qty,subtotal:knownNumber(record.total) ?? 0,photoPath:record.photoPath || null}];
}
async function commerceChange(change, message, refresh) {
  if(commerceBusy || productBusy || !currentUser || !cloudLoaded) return;
  commerceBusy=true;
  const userId=currentUser.id,state=D;
  const controls=[...document.querySelectorAll('#m button,#m input,#m select,#m textarea,nav button,#btn-logout')];
  const disabledBefore=new Map(controls.map(el=>[el,el.disabled]));
  controls.forEach(el=>el.disabled=true);
  try {
    await flushSave();
    if(D!==state || currentUser?.id!==userId) throw Error('La sesión cambió. Recargá la página.');
    const {data:record,error}=await sb.from('user_data').select('id,data,updated_at').eq('user_id',userId).maybeSingle();
    if(error)throw error;
    if(!record)throw Error('No se encontraron los datos de tu cuenta. Recargá y reintentá.');
    for(const key of ['products','quotes','sales','orders']) if(JSON.stringify(record.data[key] || [])!==JSON.stringify(D[key] || [])) throw Error('Los datos cambiaron en otra sesión. Recargá antes de reintentar.');
    const next=structuredClone(record.data);
    for(const key of ['products','quotes','sales','orders']) next[key] ||= [];
    change(next);
    for(const record of [...next.quotes,...next.sales,...next.orders]) for(const item of record.items || []) {
      if(item.snapshot && Number.isInteger(item.productIndex)) {
        const product=next.products[item.productIndex];
        if(product && !item.productId){product.id ||= crypto.randomUUID();item.productId=product.id;}
        delete item.productIndex;
      }
    }
    let query=sb.from('user_data').update({data:next,updated_at:new Date().toISOString()}).eq('user_id',userId).eq('id',record.id);
    query=record.updated_at==null ? query.is('updated_at',null) : query.eq('updated_at',record.updated_at);
    const result=await query.select('id');
    if(result.error)throw result.error;
    if(result.data?.length!==1)throw Error('No se confirmó el guardado. Recargá y reintentá.');
    if(D===state && currentUser?.id===userId){initData(next);refresh();toast(message);}
  }catch(e){toast(e.message || 'No se pudo guardar. Reintentá.');}
  finally{commerceBusy=false;controls.forEach(el=>el.disabled=disabledBefore.get(el));}
}
function sales() {
  const rows=get('sales'), products=get('products');
  const clients=[...new Set([...rows,...get('quotes')].map(r=>r.client).filter(c=>typeof c==='string' && c))];
  const photos=[];
  $('#m').innerHTML=`<section id="sales-ui"><h2>Ventas</h2><p class="s">Historial de productos vendidos. Los importes guardados no cambian al editar el catálogo.</p>
  <form class="card" id="sale-form"><div class="title">Nueva venta</div><div class="g">
  <label>Producto<select name="product"><option value="">Venta manual</option>${products.map((p,i)=>`<option value="${i}">${esc(p.name)}</option>`).join('')}</select></label>
  <label>Nombre / detalle<input name="name" required maxlength="250"></label><label>Cliente<input name="client" list="sale-clients" maxlength="250" placeholder="Consumidor final"></label>
  <datalist id="sale-clients">${clients.map(c=>`<option value="${esc(c)}"></option>`).join('')}</datalist>
  <label>Fecha<input name="date" type="date" required value="${localDate()}"></label>
  <label>Cantidad<input name="qty" type="number" min="1" step="1" value="1" required></label>
  <label>Precio unitario (AR$)<input name="price" type="number" min="0" step="0.01" required></label>
  <label>Costo unitario (AR$), si se conoce<input name="cost" type="number" min="0" step="0.01" placeholder="Sin registrar"></label></div>
  <p id="sale-total" aria-live="polite"></p><button class="p" style="margin-top:14px">Guardar venta</button></form>
  <div id="sale-editor"></div>
  <div class="product-grid">${rows.map((r,saleIndex)=>{
    const items=recordItems(r),cost=knownNumber(r.cost),total=knownNumber(r.total);
    return `<article class="product-card"><div class="product-body"><h3>${esc(r.name || r.desc || 'Venta')}</h3><p>${esc(r.client || 'Cliente sin registrar')} · ${esc(r.date || 'Fecha sin registrar')}</p>
    ${items.map(item=>{
      const reference=products.find(p=>item.productId && p.id===item.productId) || (!item.snapshot ? products.find(p=>p.name===item.name) : null);
      const index=photos.push({name:item.name,photoPath:item.photoPath || (!item.snapshot ? reference?.photoPath : null)})-1;
      return `<div class="product-photo" data-photo="${index}"><small>Sin foto disponible</small></div><h3>${esc(item.name)}</h3><p>Cantidad: ${item.qty} · Precio unitario: ${item.priceUnknown ? 'Sin registrar' : money2(item.unitPrice)}</p><p>Subtotal: ${item.priceUnknown ? 'Sin registrar' : money2(item.subtotal)}</p><p>Costo unitario: ${item.unitCost===null ? 'Sin registrar' : money2(item.unitCost)}</p><p>Ganancia del ítem: ${item.unitCost===null || item.priceUnknown ? 'Sin datos suficientes' : money2(roundMoney(item.subtotal-item.unitCost*item.qty))}</p>`;
    }).join('')}
    <dl><div><dt>Total vendido</dt><dd>${total===null?'Sin registrar':money2(total)}</dd></div><div><dt>Costo total</dt><dd>${cost===null?'Sin registrar':money2(cost)}</dd></div><div class="product-gain"><dt>Ganancia</dt><dd>${cost===null || total===null?'Pendiente de costo':money2(roundMoney(total-cost))}</dd></div></dl><button class="s2" data-edit-sale="${saleIndex}">Editar venta</button></div></article>`;
  }).join('') || '<p>Todavía no hay ventas.</p>'}</div></section>`;
  const form=$('#sale-form'),f=form.elements;
  const total=()=>{$('#sale-total').textContent='Total: '+money2(roundMoney(Number(f.qty.value)*Number(f.price.value)));};
  f.qty.oninput=total;f.price.oninput=total;
  f.product.onchange=()=>{const p=products[Number(f.product.value)];if(f.product.value!=='' && p){f.namedItem('name').value=p.name || '';f.price.value=p.price ?? '';f.cost.value=p.cost ?? '';total();}};
  form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;
    const p=f.product.value===''?null:products[Number(f.product.value)],item=snapshotItem(p,Number(f.qty.value),Number(f.price.value),f.namedItem('name').value.trim());
    item.unitCost=knownNumber(f.cost.value);
    if(!item.name || !validItem(item))return;
    const sale={id:crypto.randomUUID(),date:f.date.value,client:f.client.value.trim(),name:item.name,items:[item],qty:item.qty,total:item.subtotal,cost:item.unitCost===null?null:roundMoney(item.unitCost*item.qty)};
    await commerceChange(next=>next.sales.push(sale),'Venta guardada',sales);
  };
  document.querySelectorAll('#sales-ui [data-edit-sale]').forEach(b=>b.onclick=()=>editSale(Number(b.dataset.editSale)));
  loadProductPhotos($('#sales-ui'),photos,currentUser?.id);
}

function safeLogo(value){return typeof value==='string' && /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(value) ? value : ''; }
