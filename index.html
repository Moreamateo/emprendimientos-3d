<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emprendimientos 3D</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0a0a0c;
  --card: #141416;
  --card2: #1a1a1e;
  --tx: #f4f4f5;
  --mu: #a1a1aa;
  --bd: #27272a;
  --ac: #e11d48;
  --ac-dim: rgba(225, 29, 72, 0.15);
  --yellow: #eab308;
  --yellow-dim: rgba(234, 179, 8, 0.12);
  --ok: #22c55e;
  --ok-dim: rgba(34, 197, 94, 0.15);
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--tx);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* Sidebar */
aside {
  width: 220px;
  padding: 20px 12px;
  border-right: 1px solid var(--bd);
  background: #0e0e11;
  position: sticky;
  top: 0;
  height: 100vh;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}
aside h1 {
  font-size: 17px;
  font-weight: 700;
  margin: 0 8px 18px;
  letter-spacing: -0.02em;
}
aside h1 span { color: var(--ac); }

nav { display: flex; flex-direction: column; gap: 2px; }
nav button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  color: var(--mu);
  padding: 10px 12px;
  border-radius: 10px;
  font: inherit;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.18s ease;
}
nav button:hover { background: var(--card2); color: var(--tx); }
nav button.on {
  background: var(--ac-dim);
  color: var(--ac);
  font-weight: 600;
}
nav button .ico { font-size: 16px; width: 20px; text-align: center; }

main {
  flex: 1;
  min-width: 0;
  padding: 28px 32px 40px;
  max-width: 1100px;
  animation: fadeIn 0.35s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

h2 {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.03em;
  margin-bottom: 4px;
}
p.s { color: var(--mu); margin-bottom: 22px; font-size: 14px; }

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 16px;
  transition: border-color 0.2s ease;
}
.card:hover { border-color: #3f3f46; }
.card .title {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--tx);
  margin-bottom: 12px;
}

.g {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 14px;
}

label {
  display: block;
  font-size: 12px;
  color: var(--mu);
  font-weight: 500;
}
input, select {
  width: 100%;
  margin-top: 5px;
  padding: 10px 12px;
  border: 1px solid var(--bd);
  border-radius: 10px;
  background: var(--card2);
  color: var(--tx);
  font: inherit;
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}
input:focus, select:focus {
  outline: none;
  border-color: var(--ac);
  box-shadow: 0 0 0 3px var(--ac-dim);
}

/* Buttons */
button.p {
  background: var(--ac);
  color: #fff;
  border: 0;
  border-radius: 10px;
  padding: 11px 18px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease;
  box-shadow: 0 2px 8px rgba(225, 29, 72, 0.25);
}
button.p:hover { background: #be123c; transform: translateY(-1px); }
button.p:active { transform: translateY(0); }

button.s2 {
  background: transparent;
  border: 1px solid var(--bd);
  color: var(--tx);
  border-radius: 10px;
  padding: 10px 16px;
  font: inherit;
  font-weight: 500;
  cursor: pointer;
  width: 100%;
  margin-top: 8px;
  transition: all 0.18s ease;
}
button.s2:hover { border-color: #52525b; background: var(--card2); }

button.x {
  background: none;
  border: 0;
  color: var(--mu);
  cursor: pointer;
  font-size: 15px;
  padding: 4px 6px;
  border-radius: 6px;
  transition: color 0.15s, background 0.15s;
}
button.x:hover { color: var(--ac); background: var(--ac-dim); }

/* Layout */
.two {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 20px;
  align-items: start;
}
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } }

/* Multipliers */
.mu { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.mb {
  padding: 9px 16px;
  border: 1px solid var(--bd);
  background: var(--card2);
  color: var(--tx);
  border-radius: 10px;
  cursor: pointer;
  font: inherit;
  font-weight: 600;
  transition: all 0.18s ease;
}
.mb:hover { border-color: #52525b; }
.mb.on {
  background: var(--ac);
  border-color: var(--ac);
  color: #fff;
  box-shadow: 0 2px 10px rgba(225, 29, 72, 0.3);
}

/* Results */
.rw {
  display: flex;
  justify-content: space-between;
  padding: 7px 0;
  color: var(--mu);
  font-size: 13.5px;
  animation: slideIn 0.3s ease both;
}
.rw b { color: var(--tx); font-weight: 600; }
hr { border: 0; border-top: 1px solid var(--bd); margin: 10px 0; }

@keyframes slideIn {
  from { opacity: 0; transform: translateX(-6px); }
  to { opacity: 1; transform: translateX(0); }
}

.bx {
  border-radius: 12px;
  padding: 14px 16px;
  margin-top: 12px;
  border: 1px solid;
  animation: popIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.bx small {
  display: block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.bx div {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

@keyframes popIn {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}

.bx.total { background: var(--ac-dim); border-color: rgba(225, 29, 72, 0.45); }
.bx.total small { color: var(--ac); }
.bx.total div { color: #fda4af; }

.bx.ml { background: var(--yellow-dim); border-color: rgba(234, 179, 8, 0.4); }
.bx.ml small { color: var(--yellow); }
.bx.ml div { color: #fde047; }

.rf { list-style: none; padding: 0; margin: 10px 0 0; color: var(--mu); font-size: 12.5px; }
.rf li { padding: 3px 0; }
.hint { font-size: 11px; font-style: italic; color: var(--mu); margin-top: 2px; display: block; }

/* Tables */
.w { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td {
  text-align: left;
  padding: 10px 8px;
  border-bottom: 1px solid var(--bd);
  white-space: nowrap;
}
th {
  font-size: 11px;
  color: var(--mu);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
tr:hover td { background: rgba(255,255,255,0.02); }

.k { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
.k small { display: block; font-size: 12px; color: var(--mu); font-weight: 500; margin-top: 2px; }

a { color: var(--ac); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Profile bar */
.profile-bar {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.profile-bar select { flex: 1; min-width: 140px; }
.profile-bar button.p { white-space: nowrap; margin-top: 0; }

/* ========== STOCK ========== */
.stock-tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--bd);
  margin-bottom: 16px;
}
.stock-tabs button {
  background: none;
  border: 0;
  color: var(--mu);
  padding: 10px 18px;
  font: inherit;
  font-weight: 500;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.18s;
}
.stock-tabs button.on {
  color: var(--ac);
  border-bottom-color: var(--ac);
  font-weight: 600;
}

.filament-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: var(--card2);
  border: 1px solid var(--bd);
  border-radius: 12px;
  margin-bottom: 10px;
  transition: border-color 0.2s;
  animation: slideIn 0.3s ease both;
}
.filament-item:hover { border-color: #3f3f46; }

/* CSS Filament spool */
.spool {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  position: relative;
  flex-shrink: 0;
  box-shadow: inset 0 0 0 6px var(--spool-color, #666), 0 2px 8px rgba(0,0,0,0.4);
  background: radial-gradient(circle at 50% 50%, #1a1a1e 0%, #1a1a1e 28%, var(--spool-color, #666) 30%, var(--spool-color, #666) 100%);
}
.spool::before {
  content: '';
  position: absolute;
  inset: 14px;
  border-radius: 50%;
  background: #0e0e11;
  box-shadow: inset 0 0 0 2px #333;
}
.spool::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 8px;
  height: 8px;
  margin: -4px 0 0 -4px;
  border-radius: 50%;
  background: #333;
}

.filament-info { flex: 1; min-width: 0; }
.filament-info .name {
  font-weight: 600;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.filament-info .meta { font-size: 12px; color: var(--mu); margin-top: 2px; }
.badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 6px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.badge.pla { background: rgba(59,130,246,0.2); color: #60a5fa; }
.badge.petg { background: rgba(168,85,247,0.2); color: #c084fc; }
.badge.tpu { background: rgba(34,197,94,0.2); color: #4ade80; }
.badge.abs { background: rgba(249,115,22,0.2); color: #fb923c; }
.badge.low { background: rgba(234,179,8,0.2); color: #fbbf24; }

.progress-wrap { margin-top: 8px; }
.progress-bar {
  height: 6px;
  background: #27272a;
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 3px;
  background: var(--ac);
  transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}
.progress-fill.low { background: var(--yellow); }
.progress-fill.crit { background: #ef4444; }
.progress-text {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--mu);
  margin-top: 4px;
}

/* ========== QUOTES / PRESUPUESTOS ========== */
.quote-item, .sale-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--card2);
  border: 1px solid var(--bd);
  border-radius: 12px;
  margin-bottom: 8px;
  transition: border-color 0.2s;
  animation: slideIn 0.3s ease both;
}
.quote-item:hover, .sale-item:hover { border-color: #3f3f46; }
.quote-item .left, .sale-item .left { display: flex; flex-direction: column; gap: 2px; }
.quote-item .name { font-weight: 600; }
.quote-item .meta { font-size: 12px; color: var(--mu); }
.badge.sold { background: var(--ok-dim); color: var(--ok); }
.badge.pending { background: rgba(234,179,8,0.15); color: #fbbf24; }

/* ========== STATS BARS ========== */
.chart-card { padding: 20px; }
.chart-bars {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  height: 180px;
  padding-top: 10px;
  margin-bottom: 8px;
}
.chart-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
  justify-content: flex-end;
  gap: 4px;
}
.chart-bar-group {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  width: 100%;
  height: 100%;
  justify-content: center;
}
.chart-bar {
  width: 14px;
  border-radius: 4px 4px 0 0;
  transition: height 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  min-height: 2px;
}
.chart-bar.ing { background: #22c55e; }
.chart-bar.gas { background: #ef4444; }
.chart-label {
  font-size: 11px;
  color: var(--mu);
  text-align: center;
  margin-top: 6px;
  white-space: nowrap;
}
.legend {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin-bottom: 16px;
  font-size: 12px;
  color: var(--mu);
}
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  display: inline-block;
}
.legend .ing { background: #22c55e; }
.legend .gas { background: #ef4444; }

.stat-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--bd);
  font-size: 13.5px;
}
.stat-row:last-child { border-bottom: 0; }
.stat-row .ingreso { color: #4ade80; }
.stat-row .gasto { color: #f87171; }

/* Mobile */
@media (max-width: 760px) {
  body { flex-direction: column; }
  aside {
    width: 100%;
    height: auto;
    position: static;
    border-right: 0;
    border-bottom: 1px solid var(--bd);
    padding: 12px;
  }
  nav {
    flex-direction: row;
    overflow-x: auto;
    gap: 4px;
    padding-bottom: 4px;
  }
  nav button { width: auto; white-space: nowrap; padding: 8px 12px; }
  main { padding: 16px; }
  .bx div { font-size: 24px; }
  .chart-bars { height: 140px; }
}

.bx.pulse { animation: pulse 0.4s ease; }
@keyframes pulse {
  0% { transform: scale(1); }
  40% { transform: scale(1.02); }
  100% { transform: scale(1); }
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #22c55e;
  color: #fff;
  padding: 12px 20px;
  border-radius: 10px;
  font-weight: 600;
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 100;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Auth screen */
#auth-screen {
  position: fixed; inset: 0; z-index: 200;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
#auth-screen.hidden { display: none; }
.auth-box {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 32px 28px;
  width: 100%; max-width: 380px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.auth-box h1 {
  font-size: 22px; font-weight: 700; margin-bottom: 4px;
  text-align: center;
}
.auth-box h1 span { color: var(--ac); }
.auth-box .sub {
  text-align: center; color: var(--mu); font-size: 13px; margin-bottom: 24px;
}
.auth-box label { margin-bottom: 12px; }
.auth-box input { margin-top: 4px; }
.auth-box button.p { width: 100%; margin-top: 8px; }
.auth-box .switch {
  text-align: center; margin-top: 16px; font-size: 13px; color: var(--mu);
}
.auth-box .switch a { color: var(--ac); cursor: pointer; font-weight: 600; }
.auth-error {
  background: rgba(239,68,68,0.15); color: #fca5a5;
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: 8px; padding: 10px 12px; margin-bottom: 12px;
  font-size: 13px; display: none;
}
.auth-error.show { display: block; }
#app-wrap.hidden { display: none !important; }
.user-bar {
  margin-top: auto; padding: 12px 8px 4px;
  border-top: 1px solid var(--bd); font-size: 12px; color: var(--mu);
}
.user-bar button {
  background: none; border: 0; color: var(--ac); cursor: pointer;
  font: inherit; font-weight: 600; padding: 4px 0;
}
</style>
</head>
<body>
<div id="auth-screen">
  <div class="auth-box">
    <h1>🛠️ Emprendimientos <span>3D</span></h1>
    <p class="sub" id="auth-sub">Iniciá sesión para sincronizar tus datos</p>

</div>

// Color map for filament spools
const COLOR_MAP = {
  negro: '#1a1a1a', black: '#1a1a1a',
  blanco: '#e8e8e8', white: '#e8e8e8',
  rojo: '#dc2626', red: '#dc2626',
  azul: '#2563eb', blue: '#2563eb',
  verde: '#16a34a', green: '#16a34a',
  amarillo: '#eab308', yellow: '#eab308',
  naranja: '#ea580c', orange: '#ea580c',
  rosa: '#ec4899', pink: '#ec4899',
  violeta: '#7c3aed', purple: '#7c3aed',
  gris: '#6b7280', gray: '#6b7280', grey: '#6b7280',
  natural: '#d4c4a8', transparent: '#94a3b8',
  gold: '#ca8a04', oro: '#ca8a04',
  plata: '#94a3b8', silver: '#94a3b8',
  cyan: '#06b6d4', magenta: '#d946ef'
};

function spoolColor(name) {
  const n = (name || '').toLowerCase().trim();
  for (const [k, v] of Object.entries(COLOR_MAP)) {
    if (n.includes(k)) return v;
  }
  // fallback hash
  let h = 0;
  for (let i = 0; i < n.length; i++) h = n.charCodeAt(i) + ((h << 5) - h);
  return `hsl(${Math.abs(h) % 360}, 55%, 45%)`;
}

let cur = 'calc';
let D = {};

function initData(raw) {
  D = raw || {};
  D.cfg = Object.assign({
    pk: 20500, kwh: 140, model: 'Otro / Personalizado', w: 110,
    life: 4320, parts: 150000, err: 5, rec: 30, mult: 5,
    tallerName: '',
    aliasPago: '', cuit: '', direccion: '', telefono: '', email: ''
  }, D.cfg || {});
  if (!D.profiles) D.profiles = [];
  if (!D.stock) D.stock = [];
  if (!D.quoteCounter) D.quoteCounter = 1;
  if (!D.quotes) D.quotes = [];
  if (!D.products) D.products = [];
  if (!D.sales) D.sales = [];
}

// Solo en memoria + nube. NADA en el dispositivo.
initData({});

const get = k => D[k] || (D[k] = []);

let saveTimer = null;
const save = () => {
  if (!currentUser) return; // sin sesión no se guarda nada
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const { data: existing } = await sb.from('user_data')
        .select('id').eq('user_id', currentUser.id).maybeSingle();
      if (existing?.id) {
        const { error } = await sb.from('user_data')
          .update({ data: D, updated_at: new Date().toISOString() })
          .eq('user_id', currentUser.id);
        if (error) console.warn('Cloud update:', error.message);
      } else {
        const { error } = await sb.from('user_data')
          .insert({ user_id: currentUser.id, data: D, updated_at: new Date().toISOString() });
        if (error) console.warn('Cloud insert:', error.message);
      }
    } catch (e) { console.warn('Cloud save failed', e); }
  }, 600);
};

// ========== AUTH ==========
function showAuthError(msg) {
  const el = $('#auth-error');
  el.textContent = msg;
  el.classList.add('show');
}
function hideAuthError() {
  $('#auth-error').classList.remove('show');
}

function updateAuthUI() {
  const isLogin = authMode === 'login';
  $('#auth-sub').textContent = isLogin
    ? 'Iniciá sesión para sincronizar tus datos'
    : 'Creá tu cuenta (gratis)';
  $('#auth-btn').textContent = isLogin ? 'Iniciar sesión' : 'Registrarme';
  $('#auth-switch').innerHTML = isLogin
    ? '¿No tenés cuenta? <a id="auth-toggle">Registrate</a>'
    : '¿Ya tenés cuenta? <a id="auth-toggle">Iniciá sesión</a>';
  $('#auth-toggle').onclick = () => {
    authMode = isLogin ? 'register' : 'login';
    hideAuthError();
    updateAuthUI();
  };
}

async function loadCloudData() {
  if (!currentUser) return;
  // Siempre resetear antes de cargar (evita mezclar cuentas)
  initData({});

  try {
    const { data, error } = await sb.from('user_data')
      .select('data')
      .eq('user_id', currentUser.id)
      .maybeSingle();

    if (error) {
      console.warn('Cloud load error:', error);
      toast('No se pudo cargar de la nube, datos vacíos');
      return;
    }

    if (data && data.data) {
      // Datos de ESTA cuenta en la nube
      initData(data.data);
      
      toast('Datos de tu cuenta cargados');
    } else {
      // Cuenta nueva: vacío
      initData({});
      
      const { error: insErr } = await sb.from('user_data').insert({
        user_id: currentUser.id,
        data: D,
        updated_at: new Date().toISOString()
      });
      if (insErr) console.warn('Insert error:', insErr.message);
      toast('Cuenta nueva — todo vacío');
    }
  } catch (e) {
    console.warn('Load cloud failed', e);
    initData({});
  }
}

async function enterApp() {
  // Limpiar estado anterior de otra cuenta
  initData({});
  $('#auth-screen').classList.add('hidden');
  const wrap = $('#app-wrap');
  wrap.classList.remove('hidden');
  wrap.style.display = 'flex';
  $('#user-email').textContent = currentUser?.email || '';
  await loadCloudData();
  render();
}

function showAuth() {
  $('#auth-screen').classList.remove('hidden');
  $('#app-wrap').classList.add('hidden');
  $('#app-wrap').style.display = 'none';
  // Limpiar datos en memoria al cerrar sesión
  initData({});
  currentUser = null;
  updateAuthUI();
}

$('#auth-btn').onclick = async () => {
  hideAuthError();
  const email = $('#auth-email').value.trim();
  const pass = $('#auth-pass').value;
  if (!email || !pass) { showAuthError('Completá email y contraseña'); return; }
  if (pass.length < 6) { showAuthError('La contraseña debe tener al menos 6 caracteres'); return; }

  $('#auth-btn').disabled = true;
  $('#auth-btn').textContent = 'Espere...';

  try {
    if (authMode === 'login') {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      currentUser = data.user;
    } else {
      const { data, error } = await sb.auth.signUp({ email, password: pass });
      if (error) throw error;
      currentUser = data.user;
      if (data.session) {
        // auto logged in
      } else {
        showAuthError('Revisá tu email para confirmar la cuenta (o desactivá confirmación en Supabase)');
        $('#auth-btn').disabled = false;
        updateAuthUI();
        return;
      }
    }
    await enterApp();
  } catch (e) {
    showAuthError(e.message || 'Error de autenticación');
  }
  $('#auth-btn').disabled = false;
  updateAuthUI();
};

$('#btn-logout').onclick = async () => {
  await sb.auth.signOut();
  showAuth();
  toast('Sesión cerrada');
};

// Check existing session on load
(async () => {
  updateAuthUI();
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) {
    currentUser = session.user;
    await enterApp();
  } else {
    showAuth();
  }
})();

/* ========== CALCULADORA ========== */
function calc() {
  const C = D.cfg;
  Object.assign(C, { rec: C.rec ?? 30, mult: C.mult ?? 5 });

  const profileOpts = D.profiles.map((p, i) =>
    `<option value="${i}">${esc(p.name)}</option>`
  ).join('');

  $('#m').innerHTML = `
    <h2>Calculadora 3D</h2>
    <p class="s">Calculá el costo real de tus impresiones y el precio sugerido de venta.</p>

    <div class="two">
      <div>
        <div class="card">
          <div class="title">Perfil</div>
          <div class="profile-bar">
            <select id="profileSel">
              <option value="">— Nuevo perfil —</option>
              ${profileOpts}
            </select>
            <input id="profileName" placeholder="Nombre del perfil" style="flex:1;min-width:120px">
          </div>
          <button class="p" id="saveProfile" style="width:100%">💾 Guardar perfil</button>
        </div>

        <div class="card">
          <div class="title">Gastos fijos</div>
          <div class="g">
            <label>Precio del filamento (AR$/kg)
              <input class="ci" id="c_pk" type="number" step="any" value="${C.pk}">
            </label>
            <label>Precio del kWh (ARS)
              <input class="ci" id="c_kwh" type="number" step="any" value="${C.kwh}">
            </label>
            <label>Modelo de impresora
              <select id="c_model">
                ${['Otro / Personalizado', ...PR.map(p => p[0])].map(o =>
                  `<option ${o === C.model ? 'selected' : ''}>${o}</option>`
                ).join('')}
              </select>
            </label>
            <label>Consumo de la impresora (W)
              <input class="ci" id="c_w" type="number" step="any" value="${C.w}">
            </label>
            <label>Vida útil de la máquina (horas)
              <input class="ci" id="c_life" type="number" step="any" value="${C.life}">
            </label>
            <label>Costo de repuestos (ARS)
              <input class="ci" id="c_parts" type="number" step="any" value="${C.parts}">
            </label>
            <label>Margen de error (%)
              <input class="ci" id="c_err" type="number" step="any" value="${C.err}">
            </label>
            <label>Recargo insumos (%)
              <input class="ci" id="c_rec" type="number" step="any" value="${C.rec}">
            </label>
          </div>
        </div>

        <div class="card">
          <div class="title">Pieza</div>
          <div class="g">
            <label>Horas de impresión
              <input class="ci" id="c_h" type="number" step="any" value="" placeholder="0">
            </label>
            <label>Minutos adicionales
              <input class="ci" id="c_min" type="number" step="any" value="" placeholder="0">
            </label>
            <label>Gramos de filamento
              <input class="ci" id="c_g" type="number" step="any" value="" placeholder="0">
            </label>
            <label>Insumos extra (ARS)
              <input class="ci" id="c_ins" type="number" step="any" value="" placeholder="0">
            </label>
          </div>
        </div>
      </div>

      <div>
        <div class="card">
          <div class="title">Margen de ganancia</div>
          <label>Multiplicador</label>
          <div class="mu">
            ${[2, 2.5, 3, 3.5, 4, 5].map(m =>
              `<button class="mb ${C.mult === m ? 'on' : ''}" data-m="${m}">×${m}</button>`
            ).join('')}
          </div>
          <label style="margin-top:14px">Personalizado
            <span class="hint">Si necesitás otro valor, ingresalo acá (ej: 2.8).</span>
            <input id="cm" type="number" step="any" value="${C.mult}">
          </label>
          <details style="margin-top:14px">
            <summary style="color:var(--ac);cursor:pointer;font-size:13px;font-weight:500">Referencias</summary>
            <ul class="rf">
              <li>• ×2.0 → Alto volumen / descuento</li>
              <li>• ×2.5 → Volumen medio</li>
              <li>• ×3.0 → Mayorista</li>
              <li>• ×3.5 → Intermedio</li>
              <li>• ×4.0 → Minorista</li>
              <li>• ×5.0 → Llaveros / piezas chicas</li>
            </ul>
          </details>
        </div>

        <div class="card">
          <div class="title">Resultados</div>
          <div id="rv"></div>
          <div class="g" style="margin-top:16px">
            <label>Nombre de la pieza
              <input id="qd" placeholder="Ej: Llavero logo">
            </label>
            <label>Cliente (presupuesto)
              <input id="qc" placeholder="Opcional">
            </label>
          </div>
          <button class="p" id="sp" style="width:100%;margin-top:14px">💾 Guardar como producto</button>
          <button class="s2" id="sq">Guardar como presupuesto</button>
        </div>
      </div>
    </div>
  `;

  let lastPrice = 0;

  const up = () => {
    C.pk = +$('#c_pk').value || 0;
    C.kwh = +$('#c_kwh').value || 0;
    C.w = +$('#c_w').value || 0;
    C.life = +$('#c_life').value || 1;
    C.parts = +$('#c_parts').value || 0;
    C.err = +$('#c_err').value || 0;
    C.rec = +$('#c_rec').value || 0;
    C.model = $('#c_model').value;
    save();

    const h = (+$('#c_h').value || 0) + ((+$('#c_min').value || 0) / 60);
    const g = +$('#c_g').value || 0;
    const insRaw = +$('#c_ins').value || 0;

    const mat = (g / 1000) * C.pk;
    const luz = (C.w / 1000) * h * C.kwh;
    const des = (C.parts / (C.life || 1)) * h;
    const err = (mat + luz + des) * C.err / 100;
    const cost = mat + luz + des + err;
    const ins = insRaw * (1 + C.rec / 100);
    const price = cost * C.mult + ins;
    const all = cost + ins;

    const r = (a, b, strong) =>
      `<div class="rw"><span>${a}</span>${strong ? `<b>${b}</b>` : `<span style="color:var(--tx)">${b}</span>`}</div>`;

    const changed = Math.abs(price - lastPrice) > 0.5;
    lastPrice = price;

    $('#rv').innerHTML =
      r('Precio material', money2(mat)) +
      r('Precio luz', money2(luz)) +
      r('Desgaste máquina', money2(des)) +
      r('Margen de error', money2(err)) +
      '<hr>' +
      r('Costo total (sin insumos)', money2(cost), true) +
      r(`Insumos (+${C.rec}%)`, money2(ins)) +
      `<div class="bx total ${changed ? 'pulse' : ''}">
        <small>Total a cobrar</small>
        <div>${money2(price)}</div>
      </div>`;

    window.__lastCalc = { price, all, cost, ins };
  };

  const setM = m => {
    C.mult = m;
    save();
    $('#cm').value = m;
    $$('.mb').forEach(b => b.classList.toggle('on', +b.dataset.m === m));
    up();
  };

  $$('.mb').forEach(b => b.onclick = () => setM(+b.dataset.m));
  $('#cm').oninput = e => {
    C.mult = +e.target.value || 0;
    save();
    $$('.mb').forEach(b => b.classList.toggle('on', +b.dataset.m === C.mult));
    up();
  };

  $('#c_model').onchange = e => {
    const p = PR.find(x => x[0] === e.target.value);
    if (p) { $('#c_w').value = p[5]; C.w = p[5]; }
    C.model = e.target.value;
    save();
    up();
  };

  $$('.ci').forEach(i => i.oninput = up);
  setM(C.mult);

  // Profiles
  $('#profileSel').onchange = e => {
    const i = e.target.value;
    if (i === '') return;
    const p = D.profiles[+i];
    if (!p) return;
    Object.assign(C, p.cfg);
    save();
    render(); // reload with new values
  };

  $('#saveProfile').onclick = () => {
    const name = $('#profileName').value.trim() || `Perfil ${D.profiles.length + 1}`;
    const cfg = { ...C };
    const existing = D.profiles.findIndex(p => p.name === name);
    if (existing >= 0) D.profiles[existing] = { name, cfg };
    else D.profiles.push({ name, cfg });
    save();
    toast('Perfil guardado: ' + name);
    // refresh select
    const sel = $('#profileSel');
    sel.innerHTML = `<option value="">— Nuevo perfil —</option>` +
      D.profiles.map((p, i) => `<option value="${i}">${esc(p.name)}</option>`).join('');
  };

  $('#sp').onclick = () => {
    const { price, all } = window.__lastCalc || { price: 0, all: 0 };
    get('products').push({
      name: $('#qd').value || 'Pieza',
      cost: Math.round(all),
      price: Math.round(price)
    });
    save();
    toast('Producto guardado');
    cur = 'products';
    render();
  };

  $('#sq').onclick = () => {
    const { price } = window.__lastCalc || { price: 0 };
    get('quotes').push({
      date: new Date().toISOString().slice(0, 10),
      client: $('#qc').value || 'Sin cliente',
      desc: $('#qd').value || 'Pieza',
      total: Math.round(price),
      status: 'Pendiente'
    });
    save();
    toast('Presupuesto guardado');
    cur = 'quotes';
    render();
  };
}

  rows.forEach(r => {
    if (r.kg != null && r.grams == null) {
      r.grams = Math.round(r.kg * 1000);

    if (!r.type) r.type = 'PLA';

                <div class="progress-bar">
                  <div class="progress-fill ${crit?'crit':low?'low':''}" style="width:${pct}%"></div>
                </div>
                <div class="progress-text">
                  <span>Peso disponible</span>
                  <span>${Math.round(r.grams)} g / ${Math.round(r.total||1000)} g</span>

    $('#s_add').onclick = () => {
      const item = {
        name: $('#s_name').value || 'Filamento',
        type: $('#s_type').value,
        color: $('#s_color').value || 'Negro',
        grams: +$('#s_grams').value || 0,
        total: +$('#s_total').value || 1000,
        price: +$('#s_price').value || 0,
        other: tab === 'other'
      };
      rows.push(item);
      save();
      toast('Agregado al stock');
      renderStock();
    };

    $$('#stockList .x').forEach(b => b.onclick = () => {
      rows.splice(+b.dataset.i, 1);
      save();
      renderStock();
    });
  };

  renderStock();
}

function quotes() {
  const rows = get('quotes');
  const products = get('products');
  const C = D.cfg;

  const filter = { all: rows, pending: rows.filter(r => r.status !== 'Vendido'), sold: rows.filter(r => r.status === 'Vendido') };
  let tab = 'all';

  const renderQuotes = () => {
    const list = filter[tab] || rows;

    $('#m').innerHTML = `
      <h2>Presupuestos</h2>
      <p class="s">Creá presupuestos y generá la factura/PDF con logo y alias de pago.</p>

      <div class="card" style="margin-bottom:16px">
        <div class="title">Datos del taller (para la factura)</div>
        <div class="g">
          <label>Nombre del taller<input id="t_name" value="${esc(C.tallerName||'')}" placeholder="Nombre de tu emprendimiento"></label>
          <label>Alias de pago / CVU<input id="t_alias" value="${esc(C.aliasPago||'')}" placeholder="tu.alias.mp"></label>
          <label>CUIT / DNI<input id="t_cuit" value="${esc(C.cuit||'')}" placeholder="20-12345678-9"></label>
          <label>Dirección<input id="t_dir" value="${esc(C.direccion||'')}" placeholder="Calle 123, Ciudad"></label>
          <label>Teléfono<input id="t_tel" value="${esc(C.telefono||'')}" placeholder="+54 9 ..."></label>
          <label>Email<input id="t_email" value="${esc(C.email||'')}" placeholder="hola@taller.com"></label>
        </div>
        <div style="margin-top:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
          <div>
            <label style="margin-bottom:6px">Logo del emprendimiento</label>
            <input type="file" id="t_logo" accept="image/*" style="font-size:13px">
            <span class="hint">Se usa en la factura. Ideal cuadrado, PNG o JPG.</span>
          </div>
          ${C.logoB64
            ? `<img id="t_logo_preview" src="${C.logoB64}" alt="Logo" style="width:64px;height:64px;object-fit:contain;border-radius:10px;border:1px solid var(--bd);background:#fff">`
            : `<div id="t_logo_preview" style="width:64px;height:64px;border-radius:10px;border:1px dashed var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:11px;text-align:center">Sin logo</div>`
          }
          ${C.logoB64 ? '<button class="s2" id="t_logo_clear" style="width:auto;margin:0;padding:6px 12px;font-size:12px">Quitar logo</button>' : ''}
        </div>
        <button class="s2" id="t_save" style="margin-top:14px;width:auto">Guardar datos del taller</button>
      </div>

      <div class="card">
        <div class="stock-tabs">
          <button class="${tab==='all'?'on':''}" data-tab="all">Todos ${rows.length}</button>
          <button class="${tab==='pending'?'on':''}" data-tab="pending">Pendientes ${filter.pending.length}</button>
          <button class="${tab==='sold'?'on':''}" data-tab="sold">Vendidos ${filter.sold.length}</button>
        </div>

        <div id="qList"></div>

        <div style="margin-top:20px;border-top:1px solid var(--bd);padding-top:16px">
          <div class="title">Nuevo presupuesto</div>
          <div class="g">
            <label>Cliente<input id="q_client" placeholder="Nombre del cliente"></label>
            <label>Producto del catálogo
              <select id="q_prod">
                <option value="">— Elegir producto (opcional) —</option>
                ${products.map((p,i) => `<option value="${i}">${esc(p.name)} — ${money(p.price)}</option>`).join('')}
              </select>
            </label>
            <label>Detalle / Descripción<input id="q_desc" placeholder="Se completa si elegís producto"></label>
            <label>Precio (ARS)<input id="q_total" type="number" step="any" value="0"></label>
            <label>Fecha<input id="q_date" type="date"></label>
          </div>
          <button class="p" id="q_add" style="margin-top:14px">Crear presupuesto</button>
        </div>
      </div>
    `;

    const d = $('#q_date');
    if (d) d.valueAsDate = new Date();

    $('#t_logo').onchange = e => {
      const file = e.target.files?.[0];
      if (!file) return;
      if (file.size > 800000) {
        toast('Imagen muy pesada (máx ~800 KB)');
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        // Resize if needed via canvas
        const img = new Image();
        img.onload = () => {
          const max = 240;
          let w = img.width, h = img.height;
          if (w > max || h > max) {
            const r = Math.min(max / w, max / h);
            w = Math.round(w * r); h = Math.round(h * r);
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          C.logoB64 = canvas.toDataURL('image/png');
          $('#t_logo_preview').src = C.logoB64;
          save();
          toast('Logo cargado');
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    };

    const clearBtn = $('#t_logo_clear');
    if (clearBtn) clearBtn.onclick = () => {
      delete C.logoB64;
      save();
      toast('Logo quitado');
      renderQuotes();
    };

    $('#t_save').onclick = () => {
      C.tallerName = $('#t_name').value.trim();
      C.aliasPago = $('#t_alias').value.trim();
      C.cuit = $('#t_cuit').value.trim();
      C.direccion = $('#t_dir').value.trim();
      C.telefono = $('#t_tel').value.trim();
      C.email = $('#t_email').value.trim();
      save();
      toast('Datos del taller guardados');
    };

    $('#q_prod').onchange = e => {
      const i = e.target.value;
      if (i === '') return;
      const p = products[+i];
      if (p) {
        $('#q_desc').value = p.name;
        $('#q_total').value = p.price;
      }
    };

    const listEl = $('#qList');
    if (!list.length) {
      listEl.innerHTML = '<p style="color:var(--mu);padding:20px 0;text-align:center">No hay presupuestos en esta categoría.</p>';
    } else {
      listEl.innerHTML = list.map((r, idx) => {
        const realIdx = rows.indexOf(r);
        const isSold = r.status === 'Vendido';
        return `
          <div class="quote-item" style="animation-delay:${idx*0.04}s">
            <div class="left">
              <div class="name">
                ${esc(r.client || 'Sin cliente')}
                ${isSold ? '<span class="badge sold">VENDIDO</span>' : '<span class="badge pending">PENDIENTE</span>'}
                ${r.num ? `<span style="font-size:11px;color:var(--mu)">#${String(r.num).padStart(4,'0')}</span>` : ''}
              </div>
              <div class="meta">${esc(r.date || '')} · ${esc(r.desc || '')}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <b style="font-size:16px">${money(r.total)}</b>
              <button class="s2" style="width:auto;margin:0;padding:6px 12px;font-size:12px" data-pdf="${realIdx}">📄 Factura</button>
              ${!isSold ? `<button class="s2" style="width:auto;margin:0;padding:6px 12px;font-size:12px" data-sell="${realIdx}">Marcar vendido</button>` : ''}
              <button class="x" data-i="${realIdx}">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    $$('.stock-tabs button').forEach(b => b.onclick = () => {
      tab = b.dataset.tab;
      renderQuotes();
    });

    $('#q_add').onclick = () => {
      const num = D.quoteCounter || 1;
      D.quoteCounter = num + 1;
      rows.push({
        num,
        date: $('#q_date').value || new Date().toISOString().slice(0,10),
        client: $('#q_client').value || 'Sin cliente',
        desc: $('#q_desc').value || 'Pieza',
        total: +$('#q_total').value || 0,
        status: 'Pendiente'
      });
      save();
      toast('Presupuesto creado');
      renderQuotes();
    };

    $$('[data-pdf]').forEach(b => b.onclick = () => {
      generateInvoice(rows[+b.dataset.pdf]);
    });

    $$('[data-sell]').forEach(b => b.onclick = () => {
      const i = +b.dataset.sell;
      rows[i].status = 'Vendido';
      get('sales').push({
        date: rows[i].date,
        name: rows[i].desc,
        qty: 1,
        total: rows[i].total,
        cost: Math.round(rows[i].total * 0.4)
      });
      save();
      toast('Marcado como vendido');
      renderQuotes();
    });

    $$('#qList .x').forEach(b => b.onclick = () => {
      rows.splice(+b.dataset.i, 1);
      save();
      renderQuotes();
    });
  };

  renderQuotes();
}

/* ========== STATS ========== */
function stats() {
  const s = get('sales');
  const rev = s.reduce((a, r) => a + (r.total || 0), 0);
  const cost = s.reduce((a, r) => a + (r.cost || 0), 0);
  const profit = rev - cost;

  // group by month
  const mo = {};
  s.forEach(r => {
    const m = (r.date || '').slice(0, 7) || 's/f';
    if (!mo[m]) mo[m] = { ing: 0, gas: 0 };
    mo[m].ing += r.total || 0;
    mo[m].gas += r.cost || 0;
  });

  // last 6 months
  const months = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = d.toISOString().slice(0, 7);
    const label = d.toLocaleDateString('es-AR', { month: 'short', year: '2-digit' });
    months.push({
      key,
      label,
      ing: mo[key]?.ing || 0,
      gas: mo[key]?.gas || 0
    });
  }

  const maxVal = Math.max(1, ...months.flatMap(m => [m.ing, m.gas]));

  const stk = get('stock').reduce((a, r) => a + ((r.grams || 0) / 1000) * (r.price || 0), 0);

  $('#m').innerHTML = `
    <h2>Estadísticas</h2>
    <p class="s">Mirá cómo viene tu taller con gráficos claros y la ganancia del mes a primera vista.</p>

    <div class="card">
      <div class="g">
        <div class="k" style="color:#4ade80">${money(rev)}<small>Ingresos totales</small></div>
        <div class="k" style="color:#f87171">${money(cost)}<small>Costos / Gastos</small></div>
        <div class="k">${money(profit)}<small>Ganancia neta</small></div>
        <div class="k">${s.length}<small>Ventas registradas</small></div>
      </div>
    </div>

    <div class="card chart-card">
      <div class="title">Últimos 6 meses</div>
      <div class="legend">
        <span><i class="ing"></i> Ingresos</span>
        <span><i class="gas"></i> Gastos</span>
      </div>
      <div class="chart-bars" id="chartBars">
        ${months.map((m, i) => `
          <div class="chart-col">
            <div class="chart-bar-group">
              <div class="chart-bar ing" style="height:0%" data-h="${(m.ing / maxVal * 100).toFixed(1)}"></div>
              <div class="chart-bar gas" style="height:0%" data-h="${(m.gas / maxVal * 100).toFixed(1)}"></div>
            </div>
            <div class="chart-label">${m.label}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="card">
      <div class="title">Detalle por mes</div>
      ${months.map(m => `
        <div class="stat-row">
          <span>${m.label}</span>
          <span>
            <span class="ingreso">+ ${money(m.ing)}</span>
            &nbsp;&nbsp;
            <span class="gasto">− ${money(m.gas)}</span>
          </span>
        </div>
      `).join('') || '<p style="color:var(--mu)">Sin datos todavía.</p>'}
    </div>

    <div class="card">
      <div class="title">Valor estimado en stock</div>
      <div class="k">${money(stk)}<small>Basado en gramos restantes × precio del rollo</small></div>
    </div>
  `;

  // Animate bars
  requestAnimationFrame(() => {
    setTimeout(() => {
      $$('.chart-bar').forEach(b => {
        b.style.height = b.dataset.h + '%';
      });
    }, 50);
  });
}

/* ========== FIXED ========== */
function fixed() {
  const C = D.cfg;
  const inp = f =>
    `<label>${f[1]}<input class="fi" data-k="${f[0]}" type="number" step="any" value="${C[f[0]]}"></label>`;
  const opts = PR.map(p => p[0]).concat('Otro / Personalizado');

  $('#m').innerHTML = `
    <h2>Gastos fijos</h2>
    <p class="s">Se usan en la calculadora. Elegí tu modelo y se autocompleta el consumo (W).</p>
    <div class="card">
      <div class="g">
        ${inp(['pk','Precio del filamento (AR$/kg)'])}
        ${inp(['kwh','Precio del kWh (ARS)'])}
        <label>Modelo de impresora
          <select id="mod">${opts.map(o =>
            `<option ${o === C.model ? 'selected' : ''}>${o}</option>`
          ).join('')}</select>
        </label>
        ${inp(['w','Consumo de la impresora (W)'])}
        ${inp(['life','Vida útil de la máquina (horas)'])}
        ${inp(['parts','Costo de repuestos (ARS)'])}
        ${inp(['err','Margen de error (%)'])}
      </div>
      <p class="s" style="margin:14px 0 0">Desgaste por hora de impresión: <b id="dp">${money(C.parts / (C.life || 1))}</b></p>
    </div>
    <div class="card w">
      <div class="title">Catálogo de impresoras <span style="color:var(--mu);font-weight:400;font-size:12px">(valores aproximados)</span></div>
      <table>
        <tr>
          <th>Modelo</th><th>Volumen</th><th>Tipo</th>
          <th>Boquilla</th><th>Cama</th><th>Consumo</th><th></th>
        </tr>
        ${PR.map(p =>
          `<tr>
            <td>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td>
            <td>${p[3]} °C</td><td>${p[4]} °C</td><td>${p[5]} W</td>
            <td><button class="x" data-m="${p[0]}" style="color:var(--ac)">Usar</button></td>
          </tr>`
        ).join('')}
      </table>
    </div>
  `;

  $$('.fi').forEach(i => i.oninput = () => {
    C[i.dataset.k] = +i.value || 0;
    save();
    $('#dp').textContent = money(C.parts / (C.life || 1));
  });

  const pick = n => {
    const p = PR.find(x => x[0] === n);
    C.model = n;
    if (p) C.w = p[5];
    save();
    render();
  };
  $('#mod').onchange = e => pick(e.target.value);
  $$('[data-m]').forEach(b => b.onclick = () => pick(b.dataset.m));
}

</script>
</body>
